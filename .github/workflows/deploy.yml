name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 44.249.119.26
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/chowk
            git pull
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt -q
            sudo systemctl restart chowk
            sleep 2
            sudo systemctl is-active chowk
