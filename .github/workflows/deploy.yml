name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy triggered
        run: |
          echo "Backend push detected. EC2 auto-deploy cron will pick up the change within 60 seconds."
          echo "Commit: ${{ github.sha }}"
          echo "Pushed by: ${{ github.actor }}"
